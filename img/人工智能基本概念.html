<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>人工智能基本概念</title><style>body{font-family:"Microsoft YaHei",sans-serif;background:#eee;color:#444}.slide{width:960px;min-height:540px;background:#fff;margin:24px auto;padding:55px;box-sizing:border-box;position:relative;border-left:24px solid #eee0c2}.title{font-size:40px;font-weight:bold;color:#694634}.body{font-size:28px;line-height:1.5;margin-top:50px}.item{display:flex;gap:16px;margin:18px 0;align-items:center}.label{background:#2c91a7;color:#fff;padding:18px;width:250px;border-radius:12px;text-align:center}.desc{background:#d8e5e8;padding:18px;flex:1;border-radius:12px}</style><section class="slide"><div class="title">人工智能基本概念</div><div class="body">人工智能是研究和开发用于模拟、延伸和扩展人的智能的理论、方法、技术及应用系统的技术科学，旨在形成具备学习、思考、判断、推理、证明和自我纠错等能力的系统。</div></section><section class="slide"><div class="title">人工智能将引领第四次工业革命</div><div class="item"><div class="label">第一次工业革命</div><div class="desc">以蒸汽机的诞生为标志</div></div><div class="item"><div class="label">第二次工业革命</div><div class="desc">以电力的广泛应用和内燃机的发明为标志</div></div><div class="item"><div class="label">第三次工业革命</div><div class="desc">以原子能、电子计算机、空间技术和生物工程的发明应用为主要标志</div></div></section></html>
